---
name: Build action on push
enable-email-notifications: true
on:
  push:

jobs:
  build:
    name: Build bundle
    runs-on: docker
    steps:
      - uses: actions/checkout@v6
      - name: Install missing dependencies
        run: apt update && apt --quiet install --yes -qq docker.io
      - name: Set image tag
        id: image_tag
        run:  echo "::set-output name=tag::$(date +%Y%m%d)"
      # - name: pylint
      #   run: docker run python:3.8-alpine
      #   environment:
      #       PYTEST_ADDOPTS: --color=no
      #   commands:
      #       - pip3 install -r requirements.txt -r requirements-test.txt
      #       - py.test --pylint app/dyn.py app/dyndns.py app/config.py        
      - name: Run hadolint
        run: docker run --rm -v Dockerfile:/Dockerfile hadolint/hadolint --ignore DL3003 --ignore DL3006 /Dockerfile
      - name: Build image
        run: docker build -t registry.nbg.bufanda.de/bufanda/dyndns:latest .
